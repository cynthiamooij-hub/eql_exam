<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fitness Trainer L3 Exam Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one centred column (max 760px); a scoreboard strip on top, then the active view. Gym-floor palette: floor-line orange on cool chalk. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16242B; --muted:#5B6A70; --line:#D9E0DE;
  --accent:#D9531E; --accent-ink:#FFFFFF; --accent-soft:#FBE7DE;
  --good:#1F8A4C; --good-soft:#E2F3E8; --bad:#C2352B; --bad-soft:#FBE4E1; --warn:#B7791F; --warn-soft:#FBF0DA;
  --bar:#16242B; --bar-ink:#F3F5F4;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171B; --surface:#172228; --ink:#E7EEF0; --muted:#97A7AD; --line:#2A3940;
  --accent:#F0703C; --accent-ink:#1A0E08; --accent-soft:#3A2218;
  --good:#4CC17E; --good-soft:#15301F; --bad:#F06A5E; --bad-soft:#3A1A17; --warn:#E3A84A; --warn-soft:#352915; --bar:#0A1013; --bar-ink:#E7EEF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171B; --surface:#172228; --ink:#E7EEF0; --muted:#97A7AD; --line:#2A3940;
  --accent:#F0703C; --accent-ink:#1A0E08; --accent-soft:#3A2218;
  --good:#4CC17E; --good-soft:#15301F; --bad:#F06A5E; --bad-soft:#3A1A17; --warn:#E3A84A; --warn-soft:#352915; --bar:#0A1013; --bar-ink:#E7EEF0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.1rem;text-transform:uppercase}
h2{font-size:1.5rem;text-transform:uppercase}
h3{font-size:1.15rem}
p{margin:0}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.85rem;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-family:var(--display);font-size:1.1rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.95rem}
.btn.block{width:100%}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* menu bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
.menubar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
.mb-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:stretch;gap:2px;min-height:54px}
.brand{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.04em;display:flex;align-items:center;margin-right:14px;white-space:nowrap}
.brand i{color:var(--accent);font-style:normal}
.mb-links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.mb-links::-webkit-scrollbar{display:none}
.mb-link{background:none;border:0;border-bottom:3px solid transparent;color:var(--bar-ink);opacity:.72;font-family:var(--display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;padding:0 12px;white-space:nowrap}
.mb-link:hover{opacity:1}
.mb-link.on{opacity:1;border-bottom-color:var(--accent)}
.mb-link .ct{font-family:var(--body);font-size:.72rem;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 6px;margin-left:5px;vertical-align:2px;letter-spacing:0}
.mb-who{display:flex;align-items:center;gap:8px;font-size:.85rem;white-space:nowrap;padding-left:10px}
.mb-who .link{color:var(--bar-ink);opacity:.8}
.mb-link .sh{display:none}

/* quote footer */
.quote{max-width:760px;margin:0 auto;padding-block:8px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.quote-in{border-top:3px solid var(--ink);padding-top:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.quote .mark{font-family:var(--display);font-size:4rem;line-height:.8;color:var(--accent);font-weight:700}
.quote blockquote{margin:0;font-family:var(--display);font-size:1.45rem;font-weight:600;line-height:1.25;text-wrap:balance}
.quote .by{grid-column:2;color:var(--muted);font-size:.9rem}
.quote .tr{font-style:italic}

/* readiness */
.readiness{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.mascot{font-size:4rem;line-height:1;width:92px;height:92px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.readiness h2{font-size:1.6rem}
.readiness .say{margin-top:4px}
.meter{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.meter-track{position:relative;height:12px;border-radius:6px;background:var(--line)}
.meter-fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--warn) 45%,var(--good) 80%);background-size:calc(100% * 100 / var(--w,1)) 100%}
.meter-legend .pl{position:absolute;left:67%;transform:translateX(-50%);white-space:nowrap}
.meter-legend b{color:var(--ink)}
.meter-pass{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.meter-legend{position:relative;display:flex;justify-content:space-between;min-height:1.2em;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;border-top:1px solid var(--line);padding-top:14px}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.brand{display:none}.mb-link .lg{display:none}.mb-link .sh{display:inline}.mb-who span{display:none}.mb-who{padding-left:4px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.mascot{width:72px;height:72px;font-size:3rem}.brand{margin-right:6px}.mb-link{padding:0 9px;font-size:.95rem}}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}

/* header strip */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:12px}
.top .sync{font-size:.8rem;color:var(--muted)}

/* dashboard */
.ready{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.ready .big{font-family:var(--display);font-size:3.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ready .big small{font-size:1.4rem;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.action{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;color:var(--ink)}
.action:hover{border-color:var(--accent)}
.action.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.action.primary .muted{color:inherit;opacity:.85}
.action b{font-family:var(--display);font-size:1.35rem;text-transform:uppercase;letter-spacing:.03em}
.topics{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 120px 92px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink);width:100%}
.trow:first-child{border-top:0}
.trow:hover{background:var(--bg)}
.trow .name{font-weight:700;min-width:0}
.trow .sub{font-size:.8rem;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--muted)}
.pill{justify-self:end;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-weak .bar i{background:var(--bad)} .s-weak .pill{background:var(--bad-soft);color:var(--bad)}
.s-mid .bar i{background:var(--warn)} .s-mid .pill{background:var(--warn-soft);color:var(--warn)}
.s-strong .bar i{background:var(--good)} .s-strong .pill{background:var(--good-soft);color:var(--good)}
.s-new .pill{background:var(--bg);color:var(--muted)}
.history{display:flex;gap:6px;align-items:flex-end;height:64px}
.history span{flex:1;max-width:28px;background:var(--line);border-radius:4px 4px 0 0;position:relative}
.history span.pass{background:var(--good)} .history span.fail{background:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.counter{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums}
.clock{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:10px}
.qcard .qt{font-size:1.2rem;font-weight:700;line-height:1.4}
.tag{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tag .portal{color:var(--accent);font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr) 24px;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);font-size:1rem}
.opt .L{font-family:var(--display);font-weight:700;font-size:1.2rem}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opt .mk{font-weight:700;text-align:center}
.opt.right .mk{color:var(--good)} .opt.wrong .mk{color:var(--bad)}
.verdict{font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.explain{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line)}
.explain .es{border-top:1px dashed var(--line);padding-top:10px}
.explain .lang{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.flag{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.9rem}
.qfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

/* results */
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.result-pill{font-family:var(--display);font-size:1.3rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:6px 14px;border-radius:8px}
.result-pill.pass{background:var(--good-soft);color:var(--good)} .result-pill.fail{background:var(--bad-soft);color:var(--bad)}
.miss{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.miss:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:.9rem}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:10px;padding:12px}
@media (max-width:560px){
  .actions{grid-template-columns:1fr}
  .ready{grid-template-columns:1fr}
  .trow{grid-template-columns:minmax(0,1fr) 84px;}
  .trow .bar{display:none}
  h1{font-size:1.7rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* login */
.who{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:.85rem;color:var(--muted)}
.names{display:flex;flex-wrap:wrap;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input{font:inherit;font-size:1.1rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;max-width:320px}
.field input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.pin{letter-spacing:.4em;font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-weight:700}
.check{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<nav class="menubar" id="menubar" aria-label="Main menu"></nav>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<footer class="quote" id="quote" aria-label="Quote of the day"></footer>
<script src="config.js"></script>

<script>
let Q = [], byId = {};
const TOPICS = {anatomy:"Anatomy",physiology:"Exercise physiology",biomechanics:"Biomechanics",training:"Training principles",nutrition:"Nutrition",safety:"Health & safety",intake:"Intake & testing",coaching:"Coaching & behaviour change"};
const EXAM_N = 50, EXAM_MIN = 30, PASS = 2/3;
const app = document.getElementById('app');

/* ---------- state & storage (Supabase RPC, PIN-protected) ---------- */
const blank = () => ({v:1, q:{}, topic:{}, exams:[], updated:0});
let S = blank();
let me = null;               // {name, pin}
let saving = false, again = false, syncLabel = "";
const CFG = window.EQL_CONFIG || {};
async function rpc(fn, args){
  const r = await fetch(CFG.supabaseUrl + '/rest/v1/rpc/' + fn, {method:'POST', headers:{'apikey':CFG.supabaseKey,'Content-Type':'application/json'}, body: JSON.stringify(args||{})});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function cacheKey(){ return 'eql3:' + (me ? me.name.toLowerCase() : ''); }
function saveLocal(){ try{ localStorage.setItem(cacheKey(), JSON.stringify(S)); }catch(e){} }
function loadLocal(){ try{ const r = localStorage.getItem(cacheKey()); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function rememberMe(on){ try{ if(on) localStorage.setItem('eql3:me', JSON.stringify(me)); else localStorage.removeItem('eql3:me'); }catch(e){} }
function setSync(t){ syncLabel = t; const el = document.getElementById('sync'); if(el) el.textContent = t; }
async function save(){
  cleanExams(); S.updated = Date.now(); saveLocal();
  if(!me) return;
  if(saving){ again = true; return; }
  saving = true;
  try{
    do{ again = false; const res = await rpc('eql_save', {p_name:me.name, p_pin:me.pin, p_progress:S});
        if(!res.ok) throw new Error(res.error); } while(again);
    setSync('Progress saved');
  }catch(e){ setSync('Not saved online, kept on this laptop'); }
  saving = false;
}
async function signIn(name, pin){
  const res = await rpc('eql_login', {p_name:name, p_pin:pin});
  if(!res.ok) return res.error;
  me = {name, pin};
  const remote = Object.assign(blank(), res.progress || {});
  const local = loadLocal();
  S = (local && (local.updated||0) > (remote.updated||0)) ? Object.assign(blank(), local) : remote;
  if(S !== remote || cleanExams()) save(); else saveLocal();
  setSync('Progress saved');
  return null;
}
function signOut(){ me = null; S = blank(); rememberMe(false); view = {name:'login'}; render(); }

// drop mock exams that were stopped early (saved by older versions of the app)
function cleanExams(){
  const before = S.exams.length;
  S.exams = S.exams.filter(e=>{ const n = Object.values(e.byTopic||{}).reduce((a,b)=>a+(b.n||0),0); return n>=e.total || (e.secs||0) >= EXAM_MIN*60-5; });
  return S.exams.length !== before;
}

/* ---------- mastery & adaptive selection ---------- */
function mastery(t){ const r = S.topic[t]||[]; if(!r.length) return null; const s = r.reduce((a,b)=>a+b,0); return (s+1)/(r.length+2); }
function status(m){ if(m===null) return ['s-new','Not started']; if(m<0.6) return ['s-weak','Needs work']; if(m<0.8) return ['s-mid','Getting there']; return ['s-strong','Strong']; }
function weakness(t){ const m = mastery(t); return m===null ? 0.5 : 1-m; }
function qWeight(q, tilt=2){
  const h = S.q[q.id]; let w = 1;
  if(!h) w += 1;
  else { if(h.last===0) w += 4; if(h.streak>=2) w *= 0.25; }
  return w * (tilt===2 ? 0.4 + weakness(q.t)*2 : 0.8 + weakness(q.t)*tilt);
}
function sample(pool, n, tilt=2){
  const items = pool.map(q=>({q, k: Math.pow(Math.random(), 1/qWeight(q, tilt))}));
  items.sort((a,b)=>b.k-a.k);
  return items.slice(0,n).map(x=>x.q);
}
function weakTopics(k=3){
  const seen = Object.keys(TOPICS).filter(t=>mastery(t)!==null).sort((a,b)=>mastery(a)-mastery(b));
  const weak = seen.filter(t=>mastery(t)<0.8);
  return (weak.length ? weak : seen).slice(0,k);
}
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function record(q, ok){
  const h = S.q[q.id] || {n:0,c:0,streak:0,last:null};
  h.n++; if(ok){h.c++; h.streak++;} else h.streak=0; h.last = ok?1:0; S.q[q.id]=h;
  const r = S.topic[q.t] || []; r.push(ok?1:0); while(r.length>30) r.shift(); S.topic[q.t]=r;
  save();
}

/* ---------- readiness ---------- */
const LEVELS = [
  {min:0,  e:'🐣', t:'Just hatched',        say:'Every expert started here. Do a mock exam and train one topic a day.'},
  {min:30, e:'🐢', t:'Slow and steady',     say:'The basics are coming in. Keep going on your red topics.'},
  {min:50, e:'🏃', t:'Picking up speed',    say:'Good momentum! A few more topics need work before exam day.'},
  {min:67, e:'💪', t:'Almost exam-ready',   say:'You would probably pass today. Polish the last weak spots.'},
  {min:80, e:'🔥', t:'Exam-ready',          say:'On fire! Keep doing a mock every few days to stay sharp.'},
  {min:90, e:'🏆', t:'Champion mode',       say:'Outstanding. Go book that exam and celebrate after!'}
];
function readiness(){
  const hs = Object.values(S.q), att = hs.reduce((a,h)=>a+h.n,0);
  if(!att) return null;
  const cor = hs.reduce((a,h)=>a+h.c,0), seen = hs.length;
  const last = S.exams.slice(-3);
  const examAvg = last.length ? last.reduce((a,e)=>a+e.score/e.total,0)/last.length : null;
  const ms = Object.keys(TOPICS).map(t=>mastery(t));
  const topicAvg = ms.reduce((a,m)=>a+(m===null?0.25:m),0)/ms.length;
  const coverage = Math.min(1, seen/Q.length);
  let r = 100*(0.45*(examAvg ?? (cor/att)*0.85) + 0.35*topicAvg + 0.20*coverage);
  const weakN = ms.filter(m=>m===null||m<0.6).length;
  const strongN = ms.filter(m=>m!==null&&m>=0.8).length;
  const lastPass = last.length && last[last.length-1].score/last[last.length-1].total >= PASS;
  let why = '';
  if(!last.length){ r = Math.min(r, 49); why = 'Do a mock exam to unlock a higher score.'; }
  else if(weakN && r>79){ r = 79; why = `Fix ${weakN} weak or unstarted topic${weakN>1?'s':''} to reach exam-ready.`; }
  else if(!lastPass && r>66){ r = 66; why = 'Pass your next mock exam to move up.'; }
  r = Math.max(1, Math.round(r));
  const lvl = LEVELS.filter(l=>r>=l.min).pop();
  return {r, lvl, examAvg, seen, strongN, why};
}

/* ---------- sessions ---------- */
function prep(q){
  // portal questions keep the official option order; bank questions get shuffled options each time
  const all = q.o.map((_,i)=>i);
  const idx = (q.src==='portal' || q.fixed) ? all : shuffled(all);
  return {id:q.id, order:idx, pick:null, done:false};
}
function startExam(){
  const qs = sample(Q, EXAM_N, 0.8);
  startSession(shuffled(qs),'exam','Mock exam');
}
function startPractice(topics, label){
  const pool = Q.filter(q=>topics.includes(q.t));
  startSession(sample(pool, Math.min(20,pool.length)),'practice',label);
}
function startSession(qs, mode, label){
  view = {name:'quiz', mode, label, items: qs.map(prep), i:0, end: mode==='exam'? Date.now()+EXAM_MIN*60000 : null, startedAt: Date.now(), requeued:{} };
  render();
}

function renderQuiz(){
  const v = view, it = v.items[v.i], q = byId[it.id];
  const total = v.items.length, isExam = v.mode==='exam';
  const opts = it.order.map((oi,k)=>{
    let cls = '', mk = '';
    if(it.done){ if(oi===q.a){cls='right';mk='✓';} else if(oi===it.pick){cls='wrong';mk='✗';} }
    else if(it.pick===oi) cls='sel';
    return `<button class="opt ${cls}" data-o="${oi}" ${it.done?'disabled':''}><span class="L">${'ABCD'[k]}</span><span>${esc(q.o[oi])}</span><span class="mk">${mk}</span></button>`;
  }).join('');
  const ok = it.done && it.pick===q.a;
  app.innerHTML = `
  <div class="qhead"><button class="btn small ghost" id="quit">Stop</button><span class="counter">Question ${v.i+1} / ${total}</span>${isExam?`<span class="clock num" id="clock">${fmt((v.end-Date.now())/1000)}</span>`:`<span class="eyebrow">${esc(v.label)}</span>`}</div>
  <div class="progress"><i style="width:${(v.i+(it.done?1:0))/total*100}%"></i></div>
  <div id="quit-zone"></div>
  <section class="qcard"><span class="tag">${TOPICS[q.t]}${q.src==='portal'?' · <span class="portal">Official portal question</span>':''}</span><div class="qt">${esc(q.q)}</div></section>
  <section style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">Answer</div><div class="opts">${opts}</div></section>
  ${it.done?`<div class="verdict ${ok?'ok':'no'}">${ok?'Correct!':'Not quite. The answer is '+'ABCD'[it.order.indexOf(q.a)]+'.'}</div>
  <section class="explain">${q.flag?`<div class="flag">${esc(q.flag)}</div>`:''}<div><span class="lang">Why</span>${esc(q.e)}</div>${ok?`<div><button class="link" id="show-es">Ver en español</button></div>`:`<div class="es"><span class="lang">Por qué · Español</span>${esc(q.s)}</div>`}</section>`:''}
  <button class="btn block" id="main" ${!it.done && it.pick===null?'disabled':''}>${it.done?(v.i+1<total?'Next question':'See results'):'Confirm answer'}</button>`;
  app.querySelectorAll('.opt:not(:disabled)').forEach(b=>b.onclick=()=>{ it.pick=+b.dataset.o; renderQuiz(); });
  document.getElementById('main').onclick = ()=>{
    if(!it.done){
      it.done = true; const good = it.pick===q.a; record(q, good);
      if(!good && v.mode==='practice' && !v.requeued[q.id]){ // spaced re-ask a few questions later
        v.requeued[q.id]=1; const at = Math.min(v.items.length, v.i+4); v.items.splice(at,0,prep(q));
      }
      renderQuiz();
    } else if(v.i+1<v.items.length){ v.i++; render(); }
    else finish();
  };
  const es=document.getElementById('show-es'); if(es) es.onclick=()=>{ es.parentElement.outerHTML = `<div class="es"><span class="lang">Por qué · Español</span>${esc(q.s)}</div>`; };

    document.getElementById('q-yes').onclick=()=>finish(false); document.getElementById('q-no').onclick=()=>{document.getElementById('quit-zone').innerHTML='';};
  };
  if(isExam){
    clearInterval(timer);
    timer = setInterval(()=>{ const left=(v.end-Date.now())/1000; const c=document.getElementById('clock'); if(c){c.textContent=fmt(left); c.classList.toggle('low',left<300);} if(left<=0){clearInterval(timer); finish(true);} },500);
  }
}

function finish(timeUp){
  clearInterval(timer);
  const v = view, answered = v.items.filter(it=>it.done);
  const score = answered.filter(it=>it.pick===byId[it.id].a).length;
  const total = v.mode==='exam' ? EXAM_N : answered.length;
  const byTopic = {};
  answered.forEach(it=>{ const q=byId[it.id]; const b=byTopic[q.t]||(byTopic[q.t]={c:0,n:0}); b.n++; if(it.pick===q.a) b.c++; });
  // a mock only counts when every question is answered or the 30 minutes ran out
  const complete = answered.length===v.items.length || timeUp===true;
  if(v.mode==='exam' && complete){ S.exams.push({d:Date.now(), score, total, byTopic, secs: Math.round((Date.now()-v.startedAt)/1000)}); while(S.exams.length>30) S.exams.shift(); save(); }
  view = {name:'results', mode:v.mode, label:v.label, score, total, answered:answered.length, byTopic, timeUp:timeUp===true, counted: v.mode!=='exam' || complete, wrong: answered.filter(it=>it.pick!==byId[it.id].a).map(it=>it.id)};
  render();
}

      rememberMe(document.getElementById('rem').checked);
      view = {name:'home'}; render();
    }catch(ex){ v.err = 'No connection to the database. Check your internet and try again.'; renderLogin(); }
  };
}
async function loadNames(){
  try{ view.names = await rpc('eql_list_names'); }catch(e){ view.names = []; view.err = 'No connection to the database. Check your internet and reload.'; }
  if(view.name==='login') renderLogin();
}

/* ---------- boot ---------- */
(async function boot(){
  try{ Q = await (await fetch('questions.json', {cache:'no-cache'})).json(); byId = Object.fromEntries(Q.map(q=>[q.id,q])); }
  catch(e){ app.innerHTML = '<p class="err">Could not load the questions. Reload the page.</p>'; return; }
  let saved = null; try{ saved = JSON.parse(localStorage.getItem('eql3:me')); }catch(e){}
  if(saved && saved.name && saved.pin){
    try{ const err = await signIn(saved.name, saved.pin); if(!err){ view={name:'home'}; render(); return; } }catch(e){
      me = saved; const loc = loadLocal(); if(loc) S = Object.assign(blank(), loc); setSync('Offline, saved on this laptop'); view={name:'home'}; render(); return; }
    rememberMe(false);
  }
  view = {name:'login'}; render(); loadNames();
})();
</script>
